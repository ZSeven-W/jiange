{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "jiange.fullname" . }}
  labels:
    {{- include "jiange.labels" . | nindent 4 }}
type: Opaque
stringData:
  database-url: {{ .Values.secrets.databaseUrl | quote }}
  {{- if .Values.secrets.secretKey }}
  secret-key: {{ .Values.secrets.secretKey | quote }}
  {{- end }}
  {{- if .Values.secrets.s3AccessKey }}
  s3-access-key: {{ .Values.secrets.s3AccessKey | quote }}
  {{- end }}
  {{- if .Values.secrets.s3SecretKey }}
  s3-secret-key: {{ .Values.secrets.s3SecretKey | quote }}
  {{- end }}
  {{- if .Values.secrets.metricsToken }}
  metrics-token: {{ .Values.secrets.metricsToken | quote }}
  {{- end }}
{{- end }}
