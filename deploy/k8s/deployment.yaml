apiVersion: apps/v1
kind: Deployment
metadata:
  name: jiange
  namespace: jiange
  labels:
    app.kubernetes.io/name: jiange
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: jiange
  template:
    metadata:
      labels:
        app.kubernetes.io/name: jiange
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "8080"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: jiange
          image: ghcr.io/zseven-w/jiange:latest
          imagePullPolicy: IfNotPresent
          command:
            - /usr/local/bin/jiange
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: jiange-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: jiange-secrets
                  key: database-url
            - name: JIANGE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: jiange-secrets
                  key: database-url
            - name: JIANGE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: jiange-secrets
                  key: secret-key
                  optional: true
            - name: JIANGE_S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: jiange-secrets
                  key: s3-access-key
                  optional: true
            - name: JIANGE_S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: jiange-secrets
                  key: s3-secret-key
                  optional: true
            - name: JIANGE_METRICS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: jiange-secrets
                  key: metrics-token
                  optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: jiange
                topologyKey: kubernetes.io/hostname
