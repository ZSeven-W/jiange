services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jiange
      POSTGRES_PASSWORD: jiange
      POSTGRES_DB: jiange
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jiange"]
      interval: 5s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: jiange
      MINIO_ROOT_PASSWORD: jiange-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
volumes:
  pgdata:
  miniodata:
  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://jiange:jiange@postgres:5432/jiange?sslmode=disable
      JIANGE_S3_ENDPOINT: http://minio:9000
      JIANGE_S3_ACCESS_KEY: jiange
      JIANGE_S3_SECRET_KEY: jiange-dev-secret
    ports: ["8080:8080"]
