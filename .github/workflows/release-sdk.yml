name: Release SDKs & Go CLI

on:
  push:
    tags:
      - "sdk-v*"
      - "cli-v*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  build-ts-sdks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pnpm test:sdk:pack
      - run: pnpm --workspace-concurrency=1 test:sdk:coverage
      - run: node benchmarks/run-benchmarks.mjs
      - name: Pack all 13 SDK tarballs
        run: |
          mkdir -p release-tarballs
          for pkg in ooxml collab render-gpu sheet-sdk doc-sdk slides-sdk whiteboard-sdk base-sdk sheet-ui doc-ui slides-ui whiteboard-ui base-ui; do
            pnpm --filter "@jiange/${pkg}" pack --pack-destination ../../release-tarballs
          done
      - name: Publish npm packages on sdk-v* tags (when NPM_TOKEN is configured)
        if: startsWith(github.ref, 'refs/tags/sdk-v') && env.NODE_AUTH_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for pkg in ooxml collab render-gpu sheet-sdk doc-sdk slides-sdk whiteboard-sdk base-sdk sheet-ui doc-ui slides-ui whiteboard-ui base-ui; do
            pnpm --filter "@jiange/${pkg}" publish --access public --no-git-checks --provenance
          done
      - uses: actions/upload-artifact@v7
        with:
          name: jiange-npm-sdks
          path: release-tarballs/*.tgz

  build-go-cli:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            ext: ""
          - goos: linux
            goarch: arm64
            ext: ""
          - goos: darwin
            goarch: amd64
            ext: ""
          - goos: darwin
            goarch: arm64
            ext: ""
          - goos: windows
            goarch: amd64
            ext: ".exe"
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -count=1 -race -cover ./...
      - name: Cross-compile static binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          EXT: ${{ matrix.ext }}
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o "dist/jiange-${GOOS}-${GOARCH}${EXT}" ./cmd/jiange
        shell: bash
      - uses: actions/upload-artifact@v7
        with:
          name: jiange-cli-${{ matrix.goos }}-${{ matrix.goarch }}
          path: cli/dist/

  verify-go-sdks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: sdk/go/go.mod
          cache: false
      - working-directory: sdk/go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -count=1 -race -cover ./...
      - working-directory: sdk/go-pgstore
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -count=1 -race -cover ./...

  publish-github-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build-ts-sdks, build-go-cli, verify-go-sdks]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256 checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "${TAG}" release-assets/* \
            --title "Jiange ${TAG}" \
            --generate-notes
