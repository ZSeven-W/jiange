services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: jiange
      POSTGRES_PASSWORD: jiange
      POSTGRES_DB: jiange
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jiange"]
      interval: 5s
      retries: 10
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: jiange
      MINIO_ROOT_PASSWORD: jiange-dev-secret
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
volumes:
  pgdata:
  miniodata:
