<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-row">
        <div class="brand">
          <div class="brand-mark" aria-hidden="true">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <rect x="2.5" y="2.5" width="8.5" height="8.5" rx="2.2" fill="#3370ff" />
              <rect x="13" y="2.5" width="8.5" height="8.5" rx="2.2" fill="#3370ff" fill-opacity="0.35" />
              <rect x="2.5" y="13" width="8.5" height="8.5" rx="2.2" fill="#3370ff" fill-opacity="0.6" />
              <circle cx="17.25" cy="17.25" r="4.25" fill="#00b42a" />
            </svg>
          </div>
          <div class="brand-copy">
            <h1>Jiange AI-Native UI SDK Playground</h1>
            <span class="brand-sub">Zero-Bundler Native ESM &middot; WebGPU / WebGL2 SDF Engine</span>
          </div>
        </div>

        <div class="telemetry-bar" role="status" aria-live="polite">
          <span class="pill pill-backend" id="pill-backend" data-telemetry="backend">
            <span class="dot"></span>
            <span class="pill-label">Backend</span>
            <strong id="val-backend">init</strong>
          </span>
          <span class="pill" id="pill-draws" data-telemetry="draw-calls">
            <span class="pill-label">Draws</span>
            <strong id="val-draws">0</strong>
          </span>
          <span class="pill" id="pill-instances" data-telemetry="instances">
            <span class="pill-label">Instances</span>
            <strong id="val-instances">0</strong>
          </span>
          <span class="pill" id="pill-frame" data-telemetry="frame-ms">
            <span class="pill-label">Frame</span>
            <strong id="val-frame">0.00 ms</strong>
          </span>
          <span class="badge-zero-2d" id="badge-zero-canvas2d" title="Strictly zero Canvas 2D getContext('2d') calls across @jiange/render-gpu and all @jiange/*-ui packages">
            Zero Canvas 2D
          </span>
        </div>
      </div>

      <nav class="tabbar" role="tablist" aria-label="Jiange UI SDK Demos">
        <button class="tab-btn active" role="tab" aria-selected="true" data-tab="sheet">Sheet (GPU + Virtual2D)</button>
        <button class="tab-btn" role="tab" aria-selected="false" data-tab="doc">Doc (Virtual1D)</button>
        <button class="tab-btn" role="tab" aria-selected="false" data-tab="slides">Slides (GPU Stage)</button>
        <button class="tab-btn" role="tab" aria-selected="false" data-tab="whiteboard">Whiteboard (GPU Canvas)</button>
        <button class="tab-btn" role="tab" aria-selected="false" data-tab="base">Base (Grid/Kanban/Gantt/Dash)</button>
        <button class="tab-btn" role="tab" aria-selected="false" data-tab="glyph-lab">GPU GlyphAtlas Lab</button>
      </nav>
    </header>

    <main class="workspace">
      <section id="stage" class="stage" aria-label="Interactive SDK Stage"></section>
      <aside id="controls" class="controls" aria-label="Controls and AI Tool Drawer"></aside>
    </main>
  </div>

  <script type="module" src="/app.mjs"></script>
</body>
</html>
