name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:names
      - run: pnpm -r build
      - run: pnpm -r typecheck
      - run: pnpm test
      - run: pnpm test:sdk:pack
      - run: pnpm --workspace-concurrency=1 test:sdk:coverage
      - run: pnpm bench
      - run: pnpm --filter @jiange/collab exec tsx ../../examples/ts-headless/demo.mjs
      - run: pnpm --filter @jiange/web build
      - name: Vectors are up to date
        run: pnpm gen:vectors && git diff --exit-code spec/vectors

  cli:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: cli/go.mod
          cache: false
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -race -count=1 -cover ./...
      - run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o /tmp/jiange ./cmd/jiange && /tmp/jiange version

  sdk-go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: sdk/go/go.mod
          cache: false
      - working-directory: sdk/go
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -count=1 -cover ./...
      - working-directory: sdk/go-pgstore
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test -race -count=1 -cover ./...
      - working-directory: examples/go-backend
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go run . --check

  server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jiange
          POSTGRES_PASSWORD: jiange
          POSTGRES_DB: jiange_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jiange -d jiange_test" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: server
    env:
      JIANGE_TEST_DATABASE_URL: postgres://jiange:jiange@localhost:5432/jiange_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: test -z "$(gofmt -l .)"
      - run: go vet ./...
      - run: go test -p 1 -race -count=1 ./...
      - run: go test ./collab -run '^$' -fuzz '^FuzzDecode$' -fuzztime 15s
      - run: go test ./collab -run '^$' -fuzz '^FuzzDecodeState$' -fuzztime 15s

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jiange
          POSTGRES_PASSWORD: jiange
          POSTGRES_DB: jiange_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U jiange -d jiange_e2e" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Build web frontend & embed into Go server
        run: |
          pnpm --filter @jiange/web... build
          rm -rf server/webui/dist
          mkdir -p server/webui/dist
          cp -R apps/web/dist/. server/webui/dist/
          (cd server && go build -o ../jiange ./cmd/jiange)
      - name: Start Jiange server and wait for /readyz
        env:
          DATABASE_URL: postgres://jiange:jiange@127.0.0.1:5432/jiange_e2e?sslmode=disable
          JIANGE_ADDR: 127.0.0.1:8080
          JIANGE_SECURE_COOKIES: "false"
          JIANGE_BLOB_DIR: /tmp/jiange-e2e-blobs
          JIANGE_ALLOWED_ORIGINS: 127.0.0.1:8080,localhost:8080
          JIANGE_AUTO_VERSION_EVERY: "0"
        run: |
          mkdir -p "$JIANGE_BLOB_DIR"
          ./jiange > /tmp/jiange-e2e.log 2>&1 &
          echo $! > /tmp/jiange-e2e.pid
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/readyz >/dev/null 2>&1; then
              echo "Jiange server is ready."
              exit 0
            fi
            sleep 1
          done
          echo "Timed out waiting for http://127.0.0.1:8080/readyz"
          cat /tmp/jiange-e2e.log || true
          exit 1
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Playwright E2E suite
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
          E2E_API_URL: http://127.0.0.1:8080
        run: pnpm test:e2e
      - name: Stop Jiange server
        if: always()
        run: |
          if [ -f /tmp/jiange-e2e.pid ]; then
            kill "$(cat /tmp/jiange-e2e.pid)" 2>/dev/null || true
          fi
      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-e2e-artifacts
          path: |
            playwright-report
            test-results
            /tmp/jiange-e2e.log
          if-no-files-found: ignore
          retention-days: 7
