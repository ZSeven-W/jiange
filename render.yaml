# Render Blueprint for Jiange (free web service + free Postgres).
# Apply from the dashboard: New → Blueprint, repo ZSeven-W/jiange,
# branch deploy-uppcoder. Do not attach a disk: Free web services cannot.
# Attachments in JIANGE_BLOB_DIR are ephemeral on the Free plan
# (lost on spin-down, restart, or redeploy).
# https://render.com/docs/free
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: jiange
    runtime: docker
    plan: free
    region: singapore
    branch: deploy-uppcoder
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: JIANGE_BLOB_DIR
        value: /data/blobs
      - key: JIANGE_SECURE_COOKIES
        value: "true"
      - key: JIANGE_AUTO_VERSION_EVERY
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: jiange-db
          property: connectionString

databases:
  - name: jiange-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
    databaseName: jiange
    ipAllowList: []
